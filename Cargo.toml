[package]
name = "qala-agent"
version = "0.1.0"
edition = "2021"
authors = ["Mohamed Fathy, BPharm <lead@qala.ae>"]
description = "QALA Autonomous Enterprise OS & Corporate Agency Mesh - Dubai AI Agents Championship 2026-2027"
build = "build.rs"

[lib]
name = "qala"
path = "src/lib.rs"

[[bin]]
name = "qala"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
chrono = "0.4"

[build-dependencies]
cc = "1.1"
