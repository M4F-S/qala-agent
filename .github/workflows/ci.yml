name: Qala C99 CI & Verification Suite

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make libcurl4-openssl-dev python3

      - name: Verify C99 Build & Test Suite (make verify)
        run: |
          make verify

      - name: Test Gomaa Optional Fallback Isolation
        run: |
          GOMAA_HOME=/nonexistent make test
